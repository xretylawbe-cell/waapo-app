<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Waapo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<!--TELEGRAM_SDK--><script src="https://telegram.org/js/telegram-web-app.js"></script><!--/TELEGRAM_SDK-->
<!--CONFIG--><script src="config.js"></script><!--/CONFIG-->
<style>
:root{--paper:#F3F5F9;--panel:#FFFFFF;--ink:#101A33;--muted:#58647F;--line:#DCE1EE;--accent:#3552F6;--accent-ink:#FFFFFF;--mango:#E39A00;--jade:#0B8F66;--rose:#C9354A;--r:14px;
--head:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
:root[data-theme=dark]{--paper:#0C1220;--panel:#141C30;--ink:#E9EDF9;--muted:#9BA7C6;--line:#25314F;--accent:#7088FF;--accent-ink:#0C1220;--mango:#F2B233;--jade:#2FC594;--rose:#FF6B7E;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:18px 20px 8px}
h1,h2{font-family:var(--head);margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:30px 0 6px;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 21px var(--head)}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--jade)}.dot.off{background:var(--rose)}
.banner{margin:16px 0 0;padding:12px 14px;border-radius:var(--r);background:var(--panel);border-left:4px solid var(--mango);font-size:14px}
.next{margin-top:22px}
.next .when{font:600 15px var(--head);color:var(--muted)}
.next .clock{font:700 56px/1 var(--head);letter-spacing:-.03em;margin:6px 0 8px}
.next .clock small{font-size:22px;font-weight:600;letter-spacing:0;margin-left:4px;color:var(--muted)}
.next q{display:block;font-size:17px;quotes:"“" "”";overflow-wrap:anywhere}
.rail{position:relative;height:56px;margin:26px 2px 0}
.rail .line{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--line)}
.rail .tick{position:absolute;top:14px;width:2px;height:14px;background:var(--line)}
.rail .lab{position:absolute;top:34px;font-size:12px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.rail .mark{position:absolute;top:13px;width:14px;height:14px;margin-left:-7px;background:var(--mango);transform:rotate(45deg);border-radius:3px}
.rail .mark.first{background:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.rows{margin:0;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows b{font:600 20px var(--head)}
.rows span{color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.rows li.stack{display:block}.rows li.stack .l{display:flex;justify-content:space-between;align-items:baseline}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{background:none;color:var(--accent);width:auto;min-height:40px;padding:0 4px}
.link{color:var(--accent);font-weight:600}.link.danger{color:var(--rose)}
/* status preview: the one memorable element */
.preview{position:relative;display:grid;place-items:center;text-align:center;aspect-ratio:4/5;max-height:340px;width:100%;margin:18px 0 12px;border-radius:24px;padding:28px;overflow:hidden;font-family:var(--head);font-weight:600;line-height:1.2;overflow-wrap:anywhere;transition:background .25s,color .25s}
.preview::after{content:"Status preview";position:absolute;left:16px;bottom:12px;font:500 12px var(--body);opacity:.7}
.swatches{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.swatches::-webkit-scrollbar{display:none}
.sw{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.sw[aria-checked=true]{box-shadow:0 0 0 3px var(--ink)}
textarea,input[type=datetime-local]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 2px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{min-height:44px;font-weight:600;color:var(--muted)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item .t{font:600 17px var(--head)}
.item .x{margin:3px 0 8px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.empty{padding:26px 0;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 18px var(--head);margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;display:grid;justify-items:center;gap:3px;padding:10px 0 9px;font-size:12px;color:var(--muted);position:relative}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--accent)}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);max-width:86%;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--rose);color:#fff}
.full{min-height:70vh;display:grid;place-content:center;text-align:center;gap:10px;padding:0 24px}.full h1{font-size:26px}
.sk{height:18px;border-radius:6px;background:var(--line);margin:14px 0;opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="main"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></main>
<nav id="nav" hidden><div id="tabs"></div></nav>
<div id="toast" role="status"></div>
<script>
(() => {
const tg = window.Telegram && window.Telegram.WebApp;
const DEMO = window.WAAPO_DEMO === true || new URLSearchParams(location.search).has('demo');
const API = String(window.WAAPO_API || '').replace(/\/$/, '');
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#128C7E', '#1E88E5', '#3949AB', '#8E24AA', '#D81B60', '#E53935', '#FB8C00', '#FDD835', '#43A047', '#263238'];
const S = { me: null, posts: [], msgs: [], jobs: [], lists: null, tab: 'home', color: COLORS[0], when: 'now' };
const ICONS = { home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', posts: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>', messages: '<path d="M21 15a2 2 0 01-2 2H8l-5 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>', sending: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>', lists: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>' };
const LABEL = { home: 'Home', posts: 'Posts', messages: 'Messages', sending: 'Sending', lists: 'Lists' };

/* ---------- theme ---------- */
function theme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { tg && tg.setHeaderColor && tg.setHeaderColor(dark ? '#0C1220' : '#F3F5F9'); tg && tg.setBackgroundColor && tg.setBackgroundColor(dark ? '#0C1220' : '#F3F5F9'); } catch (e) {}
}
if (tg) { tg.ready(); tg.expand(); tg.onEvent && tg.onEvent('themeChanged', theme); }
theme();

/* ---------- time ---------- */
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
function dayLabel(ts) {
  const d = new Date(ts), diff = Math.round((sod(d) - sod(new Date())) / 864e5);
  if (diff === 0) return d.getHours() >= 18 ? 'Tonight' : 'Today';
  if (diff === 1) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
}
function until(ts) {
  const m = Math.max(0, Math.round((ts - Date.now()) / 60000)); if (m < 1) return 'any moment now'; if (m < 60) return `in ${m} min`;
  const h = Math.floor(m / 60); return h < 24 ? `in ${h} h ${m % 60} min` : `in ${Math.floor(h / 24)} d ${h % 24} h`;
}
const ink = hex => { const n = parseInt(hex.slice(1), 16), l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > 0.62 ? '#14110A' : '#FFFFFF'; };
const fmtN = n => Number(n || 0).toLocaleString();

/* ---------- api (real or demo) ---------- */
async function api(method, path, body) {
  if (DEMO) return demo(method, path, body);
  let r;
  try { r = await fetch(API + path, { method, headers: { Authorization: 'tma ' + (tg ? tg.initData : ''), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Cannot reach the server. Check your connection.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
  return j;
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, 3200); }
const buzz = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(k || 'success'); } catch (e) {} };
const confirmAsk = msg => new Promise(res => { if (tg && tg.showConfirm) tg.showConfirm(msg, res); else res(confirm(msg)); });

/* ---------- loading ---------- */
const need = k => !S.me || S.me.features[k] !== false;
async function loadMe() { S.me = await api('GET', '/api/me'); }
async function loadPosts() { if (need('schedule')) S.posts = (await api('GET', '/api/posts')).posts; }
async function loadMsgs() { if (need('messages')) S.msgs = (await api('GET', '/api/messages')).messages; }
async function loadJobs() { if (need('sending')) S.jobs = (await api('GET', '/api/jobs')).jobs; }
async function loadLists() { if (need('lists')) S.lists = await api('GET', '/api/lists'); }
const loaders = { home: () => Promise.all([loadMe(), loadPosts(), loadJobs()]), posts: () => Promise.all([loadMe(), loadPosts()]), messages: loadMsgs, sending: loadJobs, lists: loadLists };

/* ---------- screens ---------- */
function tabs() {
  const f = S.me.features, show = { home: true, posts: f.post || f.schedule, messages: f.messages, sending: f.sending, lists: f.lists };
  $('#tabs').innerHTML = Object.keys(LABEL).filter(k => show[k]).map(k => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${LABEL[k]}</button>`).join('');
  $('#nav').hidden = false;
}
function homeHTML() {
  const m = S.me, up = m.wa.up, next = S.posts[0], now = Date.now(), win = S.posts.filter(p => p.at <= now + 864e5);
  const hours = [0, 6, 12, 18, 24].map(h => ({ h, ts: now + h * 36e5 }));
  const rail = `<div class="rail" aria-hidden="true"><div class="line"></div>${hours.map((x, i) => `<div class="tick" style="left:${x.h / 24 * 100}%"></div><div class="lab" style="left:${x.h / 24 * 100}%${i === 0 ? ';transform:none' : i === 4 ? ';transform:translateX(-100%)' : ''}">${i === 0 ? 'Now' : clock(x.ts)}</div>`).join('')}${win.map((p, i) => `<div class="mark ${i === 0 ? 'first' : ''}" style="left:${Math.max(0, (p.at - now) / 864e5 * 100)}%"></div>`).join('')}</div>`;
  const nextHTML = next ? `<div class="next"><div class="when">${dayLabel(next.at)} · ${until(next.at)}</div><div class="clock">${clock(next.at).replace(/\s?(AM|PM)/i, '<small>$1</small>')}</div><q>${esc(next.text || next.type)}</q></div>${rail}<div class="sub">${win.length ? `${win.length} post${win.length === 1 ? '' : 's'} in the next 24 hours` : 'Nothing in the next 24 hours'}</div>`
    : `<div class="empty"><b>Nothing scheduled</b>Write a status and pick a time.<div style="margin-top:14px"><button class="btn" data-tab="posts">Write a status</button></div></div>`;
  const pct = (a, b) => Math.min(100, Math.round(100 * (a || 0) / Math.max(1, b || 1)));
  const planLine = m.plan.expires ? (m.plan.expired ? 'Ended' : `${m.plan.daysLeft} day${m.plan.daysLeft === 1 ? '' : 's'} left`) : 'No end date';
  return `<div class="top"><div class="brand">Waapo</div><div class="pill"><span class="dot ${!m.wa.linked ? '' : up ? 'on' : 'off'}"></span>${!m.wa.linked ? 'Not linked' : up ? 'Connected' + (m.wa.number ? ' · +' + esc(m.wa.number) : '') : 'Reconnecting'}</div></div>
${!m.wa.linked ? '<div class="banner">WhatsApp is not linked yet. Open the bot and tap <b>Link WhatsApp</b>.</div>' : ''}${m.plan.paused ? '<div class="banner">Your account is paused. Contact the admin.</div>' : ''}${m.plan.expired && !m.plan.paused ? '<div class="banner">Your plan has ended. Open the bot, then Plan, to renew.</div>' : ''}
${nextHTML}
<h2>Today</h2><ul class="rows">
<li class="stack"><div class="l"><span>Posts today</span><b>${m.usage.today} of ${m.usage.limit}</b></div><div class="bar"><i style="width:${pct(m.usage.today, m.usage.limit)}%"></i></div></li>
<li><span>Plan${m.plan.name ? ' · ' + esc(m.plan.name) : ''}</span><b>${planLine}</b></li>
<li><span>Contacts</span><b>${fmtN(m.counts.contacts)}</b></li><li><span>Groups</span><b>${fmtN(m.counts.groups)}</b></li><li><span>Lists</span><b>${fmtN(m.counts.lists)}</b></li></ul>`;
}
function postsHTML() {
  const f = S.me.features, later = S.when === 'later';
  const composer = f.post ? `<div class="top"><h1 style="font-size:24px">Write a status</h1></div>
<div class="preview" id="pv"></div>
<div class="swatches" role="radiogroup" aria-label="Background colour">${COLORS.map(c => `<button class="sw" role="radio" aria-checked="${c === S.color}" aria-label="${c}" data-color="${c}" style="background:${c}"></button>`).join('')}</div>
<textarea id="txt" maxlength="700" placeholder="Write your status" aria-label="Status text"></textarea>
<div class="meta"><span id="cnt">0 of 700</span><span>Goes to your whole audience</span></div>
<div class="seg" role="group" aria-label="When"><button data-when="now" aria-pressed="${!later}">Now</button><button data-when="later" aria-pressed="${later}">Later</button></div>
${later ? '<input type="datetime-local" id="at" aria-label="Date and time" style="margin-bottom:12px">' : ''}
<button class="btn" id="go" disabled>${later ? 'Schedule post' : 'Post now'}</button>` : '';
  return `${composer}<h2>Scheduled</h2><div id="plist"></div>`;
}
function plistHTML() {
  if (!S.posts.length) return '<div class="empty"><b>Nothing scheduled</b>Posts you schedule appear here.</div>';
  return S.posts.map(p => `<div class="item"><div class="t">${dayLabel(p.at)}, ${clock(p.at)}</div><div class="x">${esc(p.text || p.type)}</div><div class="row">${p.repeat && p.repeat !== 'none' ? `<span class="tag">Repeats ${esc(p.repeat)}</span>` : '<span></span>'}<button class="link danger" data-cancel-post="${esc(p.id)}">Cancel post</button></div></div>`).join('');
}
function targetText(t) { if (!t) return ''; const n = t.count; return { numbers: `${n} number${n === 1 ? '' : 's'}`, list: `list “${esc(t.name)}”`, groups: `${n} group${n === 1 ? '' : 's'}`, grouplist: `group list “${esc(t.name)}”`, channels: `${n} channel${n === 1 ? '' : 's'}` }[t.kind] || ''; }
function msgsHTML() {
  const list = S.msgs.length ? S.msgs.map(m => `<div class="item"><div class="t">${dayLabel(m.at)}, ${clock(m.at)}</div><div class="x">${esc(m.text || m.type)}</div><div class="row"><span class="tag">To ${targetText(m.target)}${m.repeat && m.repeat !== 'none' ? ' · repeats ' + esc(m.repeat) : ''}</span><button class="link danger" data-cancel-msg="${esc(m.id)}">Cancel message</button></div></div>`).join('')
    : '<div class="empty"><b>No scheduled messages</b>Create one in the bot under Post, then Messages.</div>';
  return `<div class="top"><h1 style="font-size:24px">Scheduled messages</h1></div>${list}`;
}
function jobsHTML() {
  const list = S.jobs.length ? S.jobs.map(j => { const left = Math.max(0, j.total - j.sent), p = j.total ? Math.round(100 * j.sent / j.total) : 0; return `<div class="item"><div class="t">${esc(j.preview || j.type)}</div><div class="sub">${j.type === 'message' ? 'Message' : 'Status'} · started ${clock(j.started)}</div><div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><div class="row" style="margin-top:10px"><span>${fmtN(j.sent)} sent · ${fmtN(left)} left</span>${j.stopping ? '<span class="tag">Stopping</span>' : `<button class="link danger" data-stop="${esc(j.id)}">Stop</button>`}</div></div>`; }).join('')
    : '<div class="empty"><b>Nothing is sending</b>When you post or send a message, you can follow it here and stop it.</div>';
  return `<div class="top"><h1 style="font-size:24px">Sending now</h1></div>${list}`;
}
function listsHTML() {
  const L = S.lists || { numbers: [], groups: [] }, rows = a => a.length ? `<ul class="rows">${a.map(x => `<li><span>${esc(x.name)}</span><b>${fmtN(x.count)}</b></li>`).join('')}</ul>` : '<div class="empty">None yet.</div>';
  return `<div class="top"><h1 style="font-size:24px">Lists</h1></div><h2>People</h2>${rows(L.numbers)}<h2>Groups</h2>${rows(L.groups)}<p class="sub" style="margin-top:22px">Create and edit lists in the bot.</p>`;
}
function previewUpdate() {
  const pv = $('#pv'), t = $('#txt'); if (!pv) return; const v = t.value, n = v.length;
  pv.style.background = S.color; pv.style.color = ink(S.color); pv.style.fontSize = n > 300 ? '18px' : n > 140 ? '22px' : n > 60 ? '27px' : '34px';
  pv.textContent = v || 'Your words appear here';  pv.style.opacity = v ? 1 : .8;
  $('#cnt').textContent = `${n} of 700`; $('#go').disabled = !v.trim() || (S.when === 'later' && !$('#at').value);
}
function defaultWhen() { const d = new Date(Date.now() + 36e5); d.setMinutes(0, 0, 0); const p = x => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:00`; }

/* ---------- navigation + actions ---------- */
async function show(tab, keep) {
  S.tab = tab; tabs();
  const main = $('#main'), html = { home: homeHTML, posts: postsHTML, messages: msgsHTML, sending: jobsHTML, lists: listsHTML }[tab];
  try { await loaders[tab](); } catch (e) { main.innerHTML = `<div class="full"><h1>Can’t load this</h1><p>${esc(e.message)}</p><button class="btn quiet" data-tab="${tab}">Try again</button></div>`; return; }
  main.innerHTML = html();
  if (tab === 'posts') { const at = $('#at'); if (at) { at.value = S.lastAt || defaultWhen(); at.min = defaultWhen(); at.addEventListener('input', () => { S.lastAt = at.value; previewUpdate(); }); } if ($('#txt')) { $('#txt').value = S.draft || ''; $('#txt').addEventListener('input', () => { S.draft = $('#txt').value; previewUpdate(); }); previewUpdate(); } $('#plist').innerHTML = plistHTML(); }
  if (!keep) window.scrollTo(0, 0);
}
async function refresh() {
  if (document.hidden || !S.me) return;
  try { await loaders[S.tab]();
    if (S.tab === 'home') $('#main').innerHTML = homeHTML(); else if (S.tab === 'posts') $('#plist').innerHTML = plistHTML(); else if (S.tab === 'messages') $('#main').innerHTML = msgsHTML(); else if (S.tab === 'sending') $('#main').innerHTML = jobsHTML(); } catch (e) {}
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.tab) return show(b.dataset.tab);
    if (b.dataset.color) { S.color = b.dataset.color; document.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-checked', x.dataset.color === S.color)); return previewUpdate(); }
    if (b.dataset.when) { S.when = b.dataset.when; return show('posts', true); }
    if (b.id === 'go') {
      b.disabled = true; const text = $('#txt').value.trim(), later = S.when === 'later';
      const r = await api('POST', '/api/posts', { text, bg: S.color, when: S.when, at: later ? new Date($('#at').value).getTime() : undefined });
      S.draft = ''; $('#txt').value = ''; buzz();
      if (r.scheduled) { toast(`Scheduled for ${dayLabel(r.at).toLowerCase()}, ${clock(r.at)}`); await loadPosts(); previewUpdate(); $('#plist').innerHTML = plistHTML(); }
      else { toast('Posting started. Follow it under Sending.'); setTimeout(() => show('sending'), 700); }
      return;
    }
    if (b.dataset.cancelPost && await confirmAsk('Cancel this scheduled post?')) { await api('DELETE', '/api/posts/' + b.dataset.cancelPost); buzz(); toast('Post cancelled'); await loadPosts(); const l = $('#plist'); if (l) l.innerHTML = plistHTML(); else $('#main').innerHTML = homeHTML(); }
    if (b.dataset.cancelMsg && await confirmAsk('Cancel this scheduled message?')) { await api('DELETE', '/api/messages/' + b.dataset.cancelMsg); buzz(); toast('Message cancelled'); await loadMsgs(); $('#main').innerHTML = msgsHTML(); }
    if (b.dataset.stop && await confirmAsk('Stop this send? People who already received it keep it.')) { await api('POST', '/api/jobs/' + b.dataset.stop + '/stop'); buzz(); toast('Stopping'); await loadJobs(); $('#main').innerHTML = jobsHTML(); }
  } catch (err) { buzz('error'); toast(err.message, true); if (b.id === 'go') b.disabled = false; }
});

/* ---------- demo data (used for ?demo and the preview page) ---------- */
const D = { t0: Date.now(), posts: null, msgs: null, jobs: null };
function demo(method, path, body) {
  const h = 36e5;
  D.posts ||= [{ id: 1, type: 'text', text: 'Good night everyone 🌙 see you tomorrow', at: Date.now() + 3.2 * h, repeat: 'daily', bg: '#263238' }, { id: 2, type: 'text', text: 'Weekend sale starts at 9 AM. Everything 20% off.', at: Date.now() + 15 * h, repeat: 'none', bg: '#E53935' }, { id: 3, type: 'image', text: 'New arrivals are in', at: Date.now() + 52 * h, repeat: 'weekly', bg: null }];
  D.msgs ||= [{ id: 11, type: 'text', text: 'Happy new week 🙏 Wishing you grace and favour.', at: Date.now() + 28 * h, repeat: 'weekly', target: { kind: 'grouplist', name: 'Church groups', count: 6 } }, { id: 12, type: 'image', text: 'Event invite: Saturday 4 PM', at: Date.now() + 70 * h, repeat: 'none', target: { kind: 'list', name: 'Customers', count: 184 } }];
  D.jobs ||= [{ id: 21, type: 'status', preview: 'Black Friday is here', total: 2500, sent: 1180, started: Date.now() - 6 * 60000, stopping: false }];
  D.jobs.forEach(j => { if (!j.stopping && j.sent < j.total) j.sent = Math.min(j.total, j.sent + 70); });
  const r = v => new Promise(res => setTimeout(() => res(v), 120)), key = method + ' ' + path;
  if (key === 'GET /api/me') return r({ id: '1', name: 'Ruthy', role: 'user', wa: { linked: true, up: true, number: '2348168593820', name: 'Ruthy' }, plan: { name: 'Monthly', expires: Date.now() + 5 * 24 * h, expired: false, paused: false, daysLeft: 5 }, usage: { today: 8, limit: 10, total: 142 }, counts: { contacts: 25716, groups: 496, scheduledPosts: D.posts.length, scheduledMessages: D.msgs.length, lists: 4 }, features: { post: true, schedule: true, messages: true, sending: true, lists: true } });
  if (key === 'GET /api/posts') return r({ posts: [...D.posts].sort((a, b) => a.at - b.at) });
  if (key === 'POST /api/posts') { if (body.when === 'later') { D.posts.push({ id: Date.now(), type: 'text', text: body.text, at: body.at, repeat: 'none', bg: body.bg }); return r({ scheduled: true, at: body.at }); } D.jobs.push({ id: Date.now(), type: 'status', preview: body.text.slice(0, 40), total: 2500, sent: 0, started: Date.now(), stopping: false }); return r({ started: true }); }
  if (method === 'DELETE' && path.startsWith('/api/posts/')) { D.posts = D.posts.filter(p => String(p.id) !== path.split('/').pop()); return r({ ok: true }); }
  if (key === 'GET /api/messages') return r({ messages: D.msgs });
  if (method === 'DELETE' && path.startsWith('/api/messages/')) { D.msgs = D.msgs.filter(p => String(p.id) !== path.split('/').pop()); return r({ ok: true }); }
  if (key === 'GET /api/jobs') return r({ jobs: D.jobs });
  if (method === 'POST' && path.endsWith('/stop')) { const j = D.jobs.find(x => String(x.id) === path.split('/')[3]); if (j) { j.stopping = true; setTimeout(() => { D.jobs = D.jobs.filter(x => x !== j); }, 2500); } return r({ ok: true }); }
  if (key === 'GET /api/lists') return r({ numbers: [{ name: 'Customers', count: 184 }, { name: 'Family', count: 23 }], groups: [{ name: 'Church groups', count: 6 }, { name: 'Business groups', count: 12 }] });
  return r({});
}

/* ---------- start ---------- */
async function start() {
  const main = $('#main');
  if (!DEMO && !(tg && tg.initData)) { main.innerHTML = '<div class="full"><h1>Open Waapo from Telegram</h1><p>This page works inside the bot. Open the bot and tap <b>Open app</b>.</p></div>'; return; }
  if (!DEMO && (!API || API.includes('YOUR-SERVER'))) { main.innerHTML = '<div class="full"><h1>Almost ready</h1><p>The server address is not set. Edit <b>config.js</b> and set <b>WAAPO_API</b>.</p></div>'; return; }
  try { await loadMe(); } catch (e) { main.innerHTML = `<div class="full"><h1>Can’t open the app</h1><p>${esc(e.message)}</p><button class="btn quiet" onclick="location.reload()">Try again</button></div>`; return; }
  await show('home');
  setInterval(refresh, 30000); document.addEventListener('visibilitychange', refresh);
  setInterval(() => { if (S.tab === 'sending') refresh(); }, 4000);
}
start();
})();
