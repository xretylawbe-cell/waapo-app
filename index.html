<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Waapo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<!--TELEGRAM_SDK--><script src="https://telegram.org/js/telegram-web-app.js"></script><!--/TELEGRAM_SDK-->
<!--CONFIG--><script src="config.js"></script><!--/CONFIG-->
<style>
:root{--paper:#F3F5F9;--panel:#FFFFFF;--ink:#101A33;--muted:#58647F;--line:#DCE1EE;--accent:#3552F6;--accent-ink:#FFFFFF;--mango:#E39A00;--jade:#0B8F66;--rose:#C9354A;--r:14px;
--head:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
:root[data-theme=dark]{--paper:#0C1220;--panel:#141C30;--ink:#E9EDF9;--muted:#9BA7C6;--line:#25314F;--accent:#7088FF;--accent-ink:#0C1220;--mango:#F2B233;--jade:#2FC594;--rose:#FF6B7E;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:18px 20px 8px}
h1,h2{font-family:var(--head);margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:30px 0 6px;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 21px var(--head)}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--jade)}.dot.off{background:var(--rose)}
.banner{margin:16px 0 0;padding:12px 14px;border-radius:var(--r);background:var(--panel);border-left:4px solid var(--mango);font-size:14px}
.next{margin-top:22px}
.next .when{font:600 15px var(--head);color:var(--muted)}
.next .clock{font:700 56px/1 var(--head);letter-spacing:-.03em;margin:6px 0 8px}
.next .clock small{font-size:22px;font-weight:600;letter-spacing:0;margin-left:4px;color:var(--muted)}
.next q{display:block;font-size:17px;quotes:"“" "”";overflow-wrap:anywhere}
.rail{position:relative;height:56px;margin:26px 2px 0}
.rail .line{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--line)}
.rail .tick{position:absolute;top:14px;width:2px;height:14px;background:var(--line)}
.rail .lab{position:absolute;top:34px;font-size:12px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.rail .mark{position:absolute;top:13px;width:14px;height:14px;margin-left:-7px;background:var(--mango);transform:rotate(45deg);border-radius:3px}
.rail .mark.first{background:var(--accent)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.rows{margin:0;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows b{font:600 20px var(--head)}
.rows span{color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.rows li.stack{display:block}.rows li.stack .l{display:flex;justify-content:space-between;align-items:baseline}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{background:none;color:var(--accent);width:auto;min-height:40px;padding:0 4px}
.link{color:var(--accent);font-weight:600}.link.danger{color:var(--rose)}
/* status preview: the one memorable element */
.preview{position:relative;display:grid;place-items:center;text-align:center;aspect-ratio:4/5;max-height:340px;width:100%;margin:18px 0 12px;border-radius:24px;padding:28px;overflow:hidden;font-family:var(--head);font-weight:600;line-height:1.2;overflow-wrap:anywhere;transition:background .25s,color .25s}
.preview::after{content:"Status preview";position:absolute;left:16px;bottom:12px;font:500 12px var(--body);opacity:.7}
.swatches{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.swatches::-webkit-scrollbar{display:none}
.sw{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.sw[aria-checked=true]{box-shadow:0 0 0 3px var(--ink)}
textarea,input[type=datetime-local]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 2px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{min-height:44px;font-weight:600;color:var(--muted)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.item{padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item .t{font:600 17px var(--head)}
.item .x{margin:3px 0 8px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.empty{padding:26px 0;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 18px var(--head);margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;display:grid;justify-items:center;gap:3px;padding:10px 0 9px;font-size:12px;color:var(--muted);position:relative}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--accent)}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);max-width:86%;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--rose);color:#fff}
.full{min-height:70vh;display:grid;place-content:center;text-align:center;gap:10px;padding:0 24px}.full h1{font-size:26px}
.sk{height:18px;border-radius:6px;background:var(--line);margin:14px 0;opacity:.6}
/* new screens */
.back{color:var(--accent);font-weight:600;min-height:40px;padding:0 2px;margin-left:-2px}
.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.menu-row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
.menu-row:last-child{border-bottom:0}.menu-row b{display:block;font:600 18px var(--head)}.menu-row span{color:var(--muted);font-size:14px}
.menu-row svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;flex:0 0 auto}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.pick i{font-style:normal;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.pick[aria-pressed=true] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick small{display:block;color:var(--muted)}
input[type=text],input[type=email],input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;background:var(--paper);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{font:700 20px var(--head);margin:0 0 4px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.hours{display:flex;align-items:flex-end;gap:3px;height:96px;margin:10px 0 6px}
.hours i{flex:1;background:var(--line);border-radius:3px 3px 0 0;min-height:3px}.hours i.top{background:var(--accent)}
.hl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.big div b{display:block;font:700 26px var(--head)}.big div span{font-size:13px;color:var(--muted)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px}
.price{font:700 20px var(--head)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rows li .menu-row{padding:0;border:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="main"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></main>
<nav id="nav" hidden><div id="tabs"></div></nav>
<div id="sheetroot"></div>
<div id="toast" role="status"></div>
<script>
(() => {
const tg = window.Telegram && window.Telegram.WebApp;
const DEMO = window.WAAPO_DEMO === true || new URLSearchParams(location.search).has('demo');
const API = String(window.WAAPO_API || '').replace(/\/$/, '');
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#128C7E', '#1E88E5', '#3949AB', '#8E24AA', '#D81B60', '#E53935', '#FB8C00', '#FDD835', '#43A047', '#263238'];
const newNm = () => ({ text: '', kind: 'list', numbers: '', list: '', grouplist: '', channels: [], groups: {}, q: '', when: 'now', at: '' });
const S = { me: null, posts: [], msgs: [], jobs: [], lists: null, plans: null, insights: null, channels: [], gres: [], tab: 'home', view: { messages: 'list', more: 'menu' }, color: COLORS[0], when: 'now', nm: newNm(), sheet: null, payWait: null, listOpen: null, listDetail: null, newList: null, lg: { sel: {}, q: '', res: [] } };
const ICONS = { home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', posts: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>', messages: '<path d="M21 15a2 2 0 01-2 2H8l-5 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>', sending: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>', more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>' };
const LABEL = { home: 'Home', posts: 'Posts', messages: 'Messages', sending: 'Sending', more: 'More' };
const CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- theme ---------- */
function theme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { tg && tg.setHeaderColor && tg.setHeaderColor(dark ? '#0C1220' : '#F3F5F9'); tg && tg.setBackgroundColor && tg.setBackgroundColor(dark ? '#0C1220' : '#F3F5F9'); } catch (e) {}
}
if (tg) { tg.ready(); tg.expand(); tg.onEvent && tg.onEvent('themeChanged', theme); }
theme();

/* ---------- time + helpers ---------- */
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
function dayLabel(ts) { const d = new Date(ts), diff = Math.round((sod(d) - sod(new Date())) / 864e5); if (diff === 0) return d.getHours() >= 18 ? 'Tonight' : 'Today'; if (diff === 1) return 'Tomorrow'; return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }); }
function until(ts) { const m = Math.max(0, Math.round((ts - Date.now()) / 60000)); if (m < 1) return 'any moment now'; if (m < 60) return `in ${m} min`; const h = Math.floor(m / 60); return h < 24 ? `in ${h} h ${m % 60} min` : `in ${Math.floor(h / 24)} d ${h % 24} h`; }
const ink = hex => { const n = parseInt(hex.slice(1), 16), l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > 0.62 ? '#14110A' : '#FFFFFF'; };
const fmtN = n => Number(n || 0).toLocaleString();
const p2 = x => String(x).padStart(2, '0');
const toLocalInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const defaultWhen = () => { const d = new Date(Date.now() + 36e5); d.setMinutes(0, 0, 0); return toLocalInput(d.getTime()); };
const hour12 = h => `${h % 12 || 12}${h < 12 ? ' AM' : ' PM'}`;
const parseNums = s => {                                  // "+234 801 111 1111" is one number; two numbers on one line are split
  const good = [], take = x => { const d = x.replace(/\D/g, ''); if (d.length >= 7 && d.length <= 15) { good.push(d); return true; } return false; };
  for (const tok of String(s || '').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean)) { if (take(tok)) continue; const parts = tok.split(/\s+/); if (parts.length > 1) parts.forEach(take); }
  return [...new Set(good)];
};

/* ---------- api (real or demo) ---------- */
async function api(method, path, body) {
  if (DEMO) return demo(method, path, body);
  let r;
  try { r = await fetch(API + path, { method, headers: { Authorization: 'tma ' + (tg ? tg.initData : ''), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Cannot reach the server. Check your connection.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
  return j;
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, 3400); }
const buzz = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(k || 'success'); } catch (e) {} };
const confirmAsk = msg => new Promise(res => { if (tg && tg.showConfirm) tg.showConfirm(msg, res); else res(confirm(msg)); });
const openLink = url => { if (DEMO) return toast('Demo: the payment page would open here.'); if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank'); };

/* ---------- loading ---------- */
const need = k => !S.me || S.me.features[k] !== false;
async function loadMe() { S.me = await api('GET', '/api/me'); }
async function loadPosts() { if (need('schedule')) S.posts = (await api('GET', '/api/posts')).posts; }
async function loadMsgs() { if (need('messages')) S.msgs = (await api('GET', '/api/messages')).messages; }
async function loadJobs() { if (need('sending')) S.jobs = (await api('GET', '/api/jobs')).jobs; }
async function loadLists() { if (need('lists') || need('glists') || need('messages')) { try { S.lists = await api('GET', '/api/lists'); } catch (e) { S.lists = S.lists || { numbers: [], groups: [] }; } } }
async function loadChannels() { if (need('messages')) { try { S.channels = (await api('GET', '/api/channels')).channels; } catch (e) { S.channels = []; } } }
async function loadListDetail() { const o = S.listOpen; S.listDetail = await api('GET', `/api/list?kind=${o.kind}&name=${encodeURIComponent(o.name)}`); }
async function loadPlans() { if (need('plan')) S.plans = await api('GET', '/api/plans'); }
async function loadInsights() { if (need('insights')) S.insights = await api('GET', '/api/insights'); }
const loaders = {
  home: () => Promise.all([loadMe(), loadPosts(), loadJobs()]), posts: () => Promise.all([loadMe(), loadPosts()]),
  messages: async () => { await loadMsgs(); if (S.view.messages === 'new') await Promise.all([loadLists(), loadChannels()]); },
  sending: loadJobs,
  more: async () => { const v = S.view.more; if (v === 'plan') await Promise.all([loadMe(), loadPlans()]); else if (v === 'insights') await loadInsights(); else if (v === 'lists') await loadLists(); else if (v === 'list') await loadListDetail(); else await loadMe(); }
};

/* ---------- screens ---------- */
function tabs() {
  const f = S.me.features, show = { home: true, posts: f.post || f.schedule, messages: f.messages, sending: f.sending, more: f.plan || f.insights || f.lists || f.glists };
  $('#tabs').innerHTML = Object.keys(LABEL).filter(k => show[k]).map(k => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${LABEL[k]}</button>`).join('');
  $('#nav').hidden = false;
}
function homeHTML() {
  const m = S.me, up = m.wa.up, next = S.posts[0], now = Date.now(), win = S.posts.filter(p => p.at <= now + 864e5);
  const hours = [0, 6, 12, 18, 24].map(h => ({ h, ts: now + h * 36e5 }));
  const rail = `<div class="rail" aria-hidden="true"><div class="line"></div>${hours.map((x, i) => `<div class="tick" style="left:${x.h / 24 * 100}%"></div><div class="lab" style="left:${x.h / 24 * 100}%${i === 0 ? ';transform:none' : i === 4 ? ';transform:translateX(-100%)' : ''}">${i === 0 ? 'Now' : clock(x.ts)}</div>`).join('')}${win.map((p, i) => `<div class="mark ${i === 0 ? 'first' : ''}" style="left:${Math.max(0, (p.at - now) / 864e5 * 100)}%"></div>`).join('')}</div>`;
  const nextHTML = next ? `<div class="next"><div class="when">${dayLabel(next.at)} · ${until(next.at)}</div><div class="clock">${clock(next.at).replace(/\s?(AM|PM)/i, '<small>$1</small>')}</div><q>${esc(next.text || next.type)}</q></div>${rail}<div class="sub">${win.length ? `${win.length} post${win.length === 1 ? '' : 's'} in the next 24 hours` : 'Nothing in the next 24 hours'}</div>`
    : `<div class="empty"><b>Nothing scheduled</b>Write a status and pick a time.<div style="margin-top:14px"><button class="btn" data-tab="posts">Write a status</button></div></div>`;
  const pct = (a, b) => Math.min(100, Math.round(100 * (a || 0) / Math.max(1, b || 1)));
  const planLine = m.plan.expires ? (m.plan.expired ? 'Ended' : `${m.plan.daysLeft} day${m.plan.daysLeft === 1 ? '' : 's'} left`) : 'No end date';
  return `<div class="top"><div class="brand">Waapo</div><div class="pill"><span class="dot ${!m.wa.linked ? '' : up ? 'on' : 'off'}"></span>${!m.wa.linked ? 'Not linked' : up ? 'Connected' + (m.wa.number ? ' · +' + esc(m.wa.number) : '') : 'Reconnecting'}</div></div>
${!m.wa.linked ? '<div class="banner">WhatsApp is not linked yet. Open the bot and tap <b>Link WhatsApp</b>.</div>' : ''}${m.plan.paused ? '<div class="banner">Your account is paused. Contact the admin.</div>' : ''}${m.plan.expired && !m.plan.paused ? '<div class="banner">Your plan has ended. Open <b>More</b>, then <b>Plan and payment</b>, to renew.</div>' : ''}
${nextHTML}
<h2>Today</h2><ul class="rows">
<li class="stack"><div class="l"><span>Posts today</span><b>${m.usage.today} of ${m.usage.limit}</b></div><div class="bar"><i style="width:${pct(m.usage.today, m.usage.limit)}%"></i></div></li>
<li><span>Plan${m.plan.name ? ' · ' + esc(m.plan.name) : ''}</span><b>${planLine}</b></li>
<li><span>Contacts</span><b>${fmtN(m.counts.contacts)}</b></li><li><span>Groups</span><b>${fmtN(m.counts.groups)}</b></li><li><span>Lists</span><b>${fmtN(m.counts.lists)}</b></li></ul>`;
}
function postsHTML() {
  const f = S.me.features, later = S.when === 'later';
  const composer = f.post ? `<div class="top"><h1 style="font-size:24px">Write a status</h1></div>
<div class="preview" id="pv"></div>
<div class="swatches" role="radiogroup" aria-label="Background colour">${COLORS.map(c => `<button class="sw" role="radio" aria-checked="${c === S.color}" aria-label="${c}" data-color="${c}" style="background:${c}"></button>`).join('')}</div>
<textarea id="txt" maxlength="700" placeholder="Write your status" aria-label="Status text"></textarea>
<div class="meta"><span id="cnt">0 of 700</span><span>Goes to your whole audience</span></div>

/* ---------- navigation + actions ---------- */
function routeHTML(tab) { return { home: homeHTML, posts: postsHTML, messages: msgsHTML, sending: jobsHTML, more: moreHTML }[tab](); }
async function show(tab, keep) {
  S.tab = tab; tabs();
  const main = $('#main');
  try { await loaders[tab](); } catch (e) { main.innerHTML = `<div class="full"><h1>Can’t load this</h1><p>${esc(e.message)}</p><button class="btn quiet" data-tab="${tab}">Try again</button></div>`; return; }
  main.innerHTML = routeHTML(tab);
  if (tab === 'posts') { const at = $('#at'); if (at) { at.value = S.lastAt || defaultWhen(); at.min = defaultWhen(); } if ($('#txt')) { $('#txt').value = S.draft || ''; previewUpdate(); } $('#plist').innerHTML = plistHTML(); }
  if (tab === 'messages' && S.view.messages === 'new') { $('#mtxt').value = S.nm.text; const at = $('#mat'); if (at) { at.value = S.nm.at || defaultWhen(); S.nm.at = at.value; at.min = defaultWhen(); } renderTarget(); }
  if (tab === 'more') afterListRender();
  if (!keep) window.scrollTo(0, 0);
}
async function refresh() {
  if (document.hidden || !S.me || S.sheet) return;
  try { await loaders[S.tab]();

}
function startPayWait() {
  S.payWait = { until: Date.now() + 4 * 60000, base: (S.me.plan.expires || 0) }; clearInterval(S.payT);
  S.payT = setInterval(async () => {
    if (!S.payWait || Date.now() > S.payWait.until) { clearInterval(S.payT); S.payWait = null; return; }
    try { await loadMe(); if ((S.me.plan.expires || 0) > S.payWait.base) { S.payWait = null; clearInterval(S.payT); buzz(); toast('Payment confirmed. Your plan is active.'); if (S.tab === 'more' && S.view.more === 'plan') { await loadPlans(); $('#main').innerHTML = planHTML(); } } } catch (e) {}
  }, 8000);
}
document.addEventListener('input', e => {
  const t = e.target, id = t && t.id; if (!id) return;
  if (id === 'txt') { S.draft = t.value; previewUpdate(); }
  else if (id === 'at') { S.lastAt = t.value; previewUpdate(); }
  else if (id === 'mtxt') { S.nm.text = t.value; nmUpdate(); }
  else if (id === 'mat') { S.nm.at = t.value; nmUpdate(); }
  else if (id === 'nums') { S.nm.numbers = t.value; nmUpdate(); }
  else if (id === 'lgq') { S.lg.q = t.value; clearTimeout(gTimer); gTimer = setTimeout(() => searchListGroups(S.lg.q), 300); }
  else if (id === 'gq') { S.nm.q = t.value; clearTimeout(gTimer); gTimer = setTimeout(() => searchGroups(S.nm.q), 300); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset || {};
  try {
    if (d.tab) { if (d.tab === 'messages' && S.tab === 'messages') S.view.messages = 'list'; if (d.tab === 'more' && S.tab === 'more') S.view.more = 'menu'; return show(d.tab); }
    if (d.color) { S.color = d.color; document.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-checked', x.dataset.color === S.color)); return previewUpdate(); }
    if (d.when) { S.when = d.when; return show('posts', true); }
    if (b.id === 'go') {
      b.disabled = true; const text = $('#txt').value.trim(), later = S.when === 'later';
      const r = await api('POST', '/api/posts', { text, bg: S.color, when: S.when, at: later ? new Date($('#at').value).getTime() : undefined });
      S.draft = ''; $('#txt').value = ''; buzz();
      if (r.scheduled) { toast(`Scheduled for ${dayLabel(r.at).toLowerCase()}, ${clock(r.at)}`); await loadPosts(); previewUpdate(); $('#plist').innerHTML = plistHTML(); }
      else { toast('Posting started. Follow it under Sending.'); setTimeout(() => show('sending'), 700); }
      return;
    }
    if (d.cancelPost !== undefined && await confirmAsk('Cancel this scheduled post?')) { await api('DELETE', '/api/posts/' + d.cancelPost); buzz(); toast('Post cancelled'); await loadPosts(); const l = $('#plist'); if (l) l.innerHTML = plistHTML(); else $('#main').innerHTML = homeHTML(); return; }
    if (d.cancelMsg !== undefined && await confirmAsk('Cancel this scheduled message?')) { await api('DELETE', '/api/messages/' + d.cancelMsg); buzz(); toast('Message cancelled'); await loadMsgs(); $('#main').innerHTML = msgsHTML(); return; }
    if (d.stop !== undefined && await confirmAsk('Stop this send? People who already received it keep it.')) { await api('POST', '/api/jobs/' + d.stop + '/stop'); buzz(); toast('Stopping'); await loadJobs(); $('#main').innerHTML = jobsHTML(); return; }
    /* edit sheet */
    if (d.editPost !== undefined) { const p = S.posts.find(x => String(x.id) === d.editPost); if (p) openSheet('post', p); return; }
    if (d.editMsg !== undefined) { const m = S.msgs.find(x => String(x.id) === d.editMsg); if (m) openSheet('msg', m); return; }
    if (d.sheetClose !== undefined && e.target === b || d.sheetCloseBtn !== undefined) return closeSheet();
    if (d.sheetSave !== undefined) {
      const s = S.sheet, at = new Date($('#sheet-at').value).getTime(), text = $('#sheet-text').value;
      await api('POST', `/api/${s.kind === 'post' ? 'posts' : 'messages'}/${s.id}/edit`, { text, at }); buzz(); toast('Saved'); closeSheet();
      if (s.kind === 'post') { await loadPosts(); const l = $('#plist'); if (l) l.innerHTML = plistHTML(); else $('#main').innerHTML = homeHTML(); } else { await loadMsgs(); $('#main').innerHTML = msgsHTML(); }
      return;
    }
    /* new message */
    if (d.newmsg !== undefined) { S.nm = newNm(); S.view.messages = 'new'; return show('messages'); }
    if (d.back === 'messages') { S.view.messages = 'list'; return show('messages'); }
    if (d.kind) { S.nm.kind = d.kind; document.querySelectorAll('[data-kind]').forEach(x => x.setAttribute('aria-pressed', x.dataset.kind === d.kind)); return renderTarget(); }
    if (d.mwhen) { S.nm.when = d.mwhen; return show('messages', true); }
    if (d.list !== undefined) { S.nm.list = d.list; $('#target').innerHTML = targetHTML(); return nmUpdate(); }
    if (d.glist !== undefined) { S.nm.grouplist = d.glist; $('#target').innerHTML = targetHTML(); return nmUpdate(); }
    if (d.chan !== undefined) { const c = S.nm.channels, i = c.indexOf(d.chan); i < 0 ? c.push(d.chan) : c.splice(i, 1); $('#target').innerHTML = targetHTML(); return nmUpdate(); }
    if (d.gtoggle !== undefined) { const g = S.gres.find(x => x.id === d.gtoggle); if (S.nm.groups[d.gtoggle]) delete S.nm.groups[d.gtoggle]; else S.nm.groups[d.gtoggle] = g ? g.name : d.gtoggle; $('#gres').innerHTML = gresHTML(); return nmUpdate(); }
    if (b.id === 'msend') {
      b.disabled = true; const n = S.nm, later = n.when === 'later';
      const r = await api('POST', '/api/messages', { text: n.text.trim(), target: nmTarget(), when: n.when, at: later ? new Date(n.at).getTime() : undefined });
      buzz(); S.nm = newNm(); S.view.messages = 'list';
      if (r.scheduled) { toast(`Scheduled for ${r.recipients} ${r.recipients === 1 ? 'recipient' : 'recipients'}`); await show('messages'); } else { toast('Sending started. Follow it under Sending.'); setTimeout(() => show('sending'), 700); }
      return;
    }
    /* more */
    if (d.lk !== undefined) { S.listOpen = { kind: d.lk, name: d.ln }; S.lg = { sel: {}, q: '', res: [] }; S.view.more = 'list'; return show('more'); }
    if (d.newlist !== undefined) { S.newList = d.newlist; $('#main').innerHTML = moreHTML(); const i = $('#lname'); if (i && i.focus) i.focus(); return; }
    if (d.newlistCancel !== undefined) { S.newList = null; $('#main').innerHTML = moreHTML(); return; }
    if (d.newlistGo !== undefined) { const kind = S.newList, name = $('#lname').value.trim(); await api('POST', '/api/lists', { kind, name }); buzz(); toast('List created'); S.listOpen = { kind, name }; S.newList = null; S.lg = { sel: {}, q: '', res: [] }; S.view.more = 'list'; return show('more'); }
    if (d.addnums !== undefined) {
      const nums = parseNums($('#lnums').value); if (!nums.length) { toast('Add at least one valid number with country code.', true); return; }
      b.disabled = true; let added = 0;
      try { for (let i = 0; i < nums.length; i += 800) { const r = await api('POST', '/api/lists/add', { kind: 'numbers', name: S.listOpen.name, items: nums.slice(i, i + 800) }); added += r.added; } } finally { b.disabled = false; }
      buzz(); toast(`Added ${fmtN(added)}${nums.length > added ? `, ${fmtN(nums.length - added)} already there` : ''}`); await loadListDetail(); $('#main').innerHTML = listDetailHTML(); return;
    }
    if (d.lgtoggle !== undefined) { const g = S.lg.res.find(x => x.id === d.lgtoggle); if (S.lg.sel[d.lgtoggle]) delete S.lg.sel[d.lgtoggle]; else S.lg.sel[d.lgtoggle] = g ? g.name : d.lgtoggle; $('#lgres').innerHTML = lgresHTML(); return lgUpdate(); }
    if (d.lgadd !== undefined) { b.disabled = true; const r = await api('POST', '/api/lists/add', { kind: 'groups', name: S.listOpen.name, items: Object.keys(S.lg.sel) }); S.lg.sel = {}; buzz(); toast(`Added ${r.added} group${r.added === 1 ? '' : 's'}`); await loadListDetail(); $('#main').innerHTML = listDetailHTML(); afterListRender(); return; }
    if (d.lrm !== undefined) { await api('POST', '/api/lists/remove', { kind: S.listOpen.kind, name: S.listOpen.name, items: [d.lrm] }); buzz(); await loadListDetail(); $('#main').innerHTML = listDetailHTML(); afterListRender(); return; }
    if (d.ldel !== undefined) {
      const u = S.listDetail.used || 0;
      if (!(await confirmAsk(`Delete “${S.listOpen.name}”?${u ? ` ${u} scheduled message${u === 1 ? '' : 's'} use it and will not send.` : ''}`))) return;
      await api('POST', '/api/lists/delete', { kind: S.listOpen.kind, name: S.listOpen.name }); buzz(); toast('List deleted'); S.listOpen = null; S.view.more = 'lists'; return show('more');
    }
    if (d.back === 'lists') { S.view.more = 'lists'; S.listOpen = null; return show('more'); }
    if (d.sub) { S.view.more = d.sub; return show('more'); }
    if (d.back === 'more') { S.view.more = 'menu'; return show('more'); }
    if (d.pay !== undefined) {
      b.disabled = true; const email = $('#pemail') ? $('#pemail').value.trim() : '';
      try { const r = await api('POST', '/api/pay', { planId: d.pay, email: email || undefined }); openLink(r.url); toast('Payment page opened. Your plan activates by itself after you pay.'); if (!DEMO) startPayWait(); else S.payWait = { until: 0, base: 0 }; await loadPlans(); $('#main').innerHTML = planHTML(); }
      finally { b.disabled = false; } return;
    }
  } catch (err) { buzz('error'); toast(err.message, true); if (b.id === 'go' || b.id === 'msend') b.disabled = false; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

/* ---------- demo data (used for ?demo and the preview page) ---------- */
const D = { posts: null, msgs: null, jobs: null, plan: 5, lists: null };
const DG = ['Church Youth', 'Church Choir', 'Business Owners', 'Lagos Traders', 'Family Circle', 'Old School Friends', 'Alumni 2012', 'Football Fans', 'Neighbours Watch', 'Online Sellers'];
function demo(method, full, body) {
  const [path, qs] = full.split('?'), h = 36e5, q = new URLSearchParams(qs || '');
  D.posts ||= [{ id: 1, type: 'text', text: 'Good night everyone 🌙 see you tomorrow', at: Date.now() + 3.2 * h, repeat: 'daily', bg: '#263238' }, { id: 2, type: 'text', text: 'Weekend sale starts at 9 AM. Everything 20% off.', at: Date.now() + 15 * h, repeat: 'none', bg: '#E53935' }, { id: 3, type: 'image', text: 'New arrivals are in', at: Date.now() + 52 * h, repeat: 'weekly', bg: null }];

  D.lists ||= { numbers: { Customers: Array.from({ length: 184 }, (_, i) => '23480' + String(11110000 + i)), Family: ['2348012340001', '2348012340002', '2348012340003'] }, groups: { 'Church groups': ['g0', 'g1', 'g4', 'g5', 'g6', 'g8'], 'Business groups': ['g2', 'g3', 'g9', 'g7'] } };
  D.jobs ||= [{ id: 21, type: 'status', preview: 'Black Friday is here', total: 2500, sent: 1180, started: Date.now() - 6 * 60000, stopping: false }];
  D.jobs.forEach(j => { if (!j.stopping && j.sent < j.total) j.sent = Math.min(j.total, j.sent + 70); });
  const r = v => new Promise(res => setTimeout(() => res(v), 120)), key = method + ' ' + path, last = path.split('/').pop();
  if (key === 'GET /api/me') return r({ id: '1', name: 'Ruthy', role: 'user', wa: { linked: true, up: true, number: '2348168593820', name: 'Ruthy' }, plan: { name: 'Monthly', expires: Date.now() + D.plan * 24 * h, expired: false, paused: false, daysLeft: D.plan }, usage: { today: 8, limit: 10, total: 142 }, counts: { contacts: 25716, groups: 496, scheduledPosts: D.posts.length, scheduledMessages: D.msgs.length, lists: 4 }, features: { post: true, schedule: true, messages: true, sending: true, lists: true, glists: true, plan: true, insights: true } });
  if (key === 'GET /api/posts') return r({ posts: [...D.posts].sort((a, b) => a.at - b.at) });
  if (key === 'POST /api/posts') { if (body.when === 'later') { D.posts.push({ id: Date.now(), type: 'text', text: body.text, at: body.at, repeat: 'none', bg: body.bg }); return r({ scheduled: true, at: body.at }); } D.jobs.push({ id: Date.now(), type: 'status', preview: body.text.slice(0, 40), total: 2500, sent: 0, started: Date.now(), stopping: false }); return r({ started: true }); }
  if (method === 'DELETE' && path.startsWith('/api/posts/')) { D.posts = D.posts.filter(p => String(p.id) !== last); return r({ ok: true }); }
  if (method === 'POST' && /^\/api\/posts\/[^/]+\/edit$/.test(path)) { const p = D.posts.find(x => String(x.id) === path.split('/')[3]); if (p) { if (body.text !== undefined) p.text = body.text; if (body.at !== undefined) p.at = body.at; } return r({ ok: true }); }
  if (key === 'GET /api/messages') return r({ messages: [...D.msgs].sort((a, b) => a.at - b.at) });
  if (method === 'DELETE' && path.startsWith('/api/messages/')) { D.msgs = D.msgs.filter(p => String(p.id) !== last); return r({ ok: true }); }
  if (method === 'POST' && /^\/api\/messages\/[^/]+\/edit$/.test(path)) { const m = D.msgs.find(x => String(x.id) === path.split('/')[3]); if (m) { if (body.text !== undefined) m.text = body.text; if (body.at !== undefined) m.at = body.at; } return r({ ok: true }); }
  if (key === 'POST /api/messages') { const t = body.target, n = t.kind === 'numbers' ? t.numbers.length : t.kind === 'list' ? 184 : t.kind === 'grouplist' ? 6 : t.ids.length; if (body.when === 'later') { D.msgs.push({ id: Date.now(), type: 'text', text: body.text, at: body.at, repeat: 'none', target: { kind: t.kind, name: t.name, count: n } }); return r({ scheduled: true, at: body.at, recipients: n }); } D.jobs.push({ id: Date.now(), type: 'message', preview: body.text.slice(0, 40), total: n, sent: 0, started: Date.now(), stopping: false }); return r({ started: true, recipients: n }); }
  if (key === 'GET /api/groups') { const term = (q.get('q') || '').toLowerCase(); return r({ groups: DG.filter(g => g.toLowerCase().includes(term)).map((g, i) => ({ id: 'g' + DG.indexOf(g), name: g, size: 40 + i * 37, admin: i % 3 === 0 })), total: 496 }); }
  if (key === 'GET /api/channels') return r({ channels: [{ id: 'c1', name: 'Waapo News', role: 'OWNER' }] });
  if (key === 'GET /api/jobs') return r({ jobs: D.jobs });
  if (method === 'POST' && path.endsWith('/stop')) { const j = D.jobs.find(x => String(x.id) === path.split('/')[3]); if (j) { j.stopping = true; setTimeout(() => { D.jobs = D.jobs.filter(x => x !== j); }, 2500); } return r({ ok: true }); }
  const cnt = o => Object.entries(o).map(([name, v]) => ({ name, count: v.length }));
  if (key === 'GET /api/lists') return r({ numbers: cnt(D.lists.numbers), groups: cnt(D.lists.groups) });
  if (key === 'GET /api/list') { const kind = q.get('kind'), name = q.get('name'), L = D.lists[kind] && D.lists[kind][name]; if (!L) return Promise.reject(new Error('That list no longer exists.')); const used = D.msgs.filter(m => m.target && m.target.name === name).length;
    return r({ kind, name, total: L.length, used, members: kind === 'numbers' ? L.slice(0, 200).map(n => ({ number: n, name: { '2348011111111': 'Ada Obi', '2348022222222': 'Chidi Eze', '2348012340001': 'Bola' }[n] || '' })) : L.slice(0, 200).map(id => ({ id, name: DG[+id.slice(1)] || 'A group you have left', size: 40 + (+id.slice(1)) * 37 })) }); }
  if (key === 'POST /api/lists') { const L = D.lists[body.kind]; if (!body.name || !body.name.trim()) return Promise.reject(new Error('Give the list a name of 1 to 30 characters.')); if (L[body.name.trim()]) return Promise.reject(new Error('You already have a list with that name.')); L[body.name.trim()] = []; return r({ ok: true, name: body.name.trim(), total: 0, skipped: 0 }); }
  if (key === 'POST /api/lists/add') { const L = D.lists[body.kind][body.name]; if (!L) return Promise.reject(new Error('That list no longer exists.')); const before = new Set(L), add = [...new Set((body.items || []).filter(x => !before.has(x)))]; L.push(...add); return r({ ok: true, added: add.length, skipped: 0, total: L.length }); }
  if (key === 'POST /api/lists/remove') { const L = D.lists[body.kind][body.name], n = L.length; D.lists[body.kind][body.name] = L.filter(x => !(body.items || []).includes(x)); return r({ ok: true, removed: n - D.lists[body.kind][body.name].length, total: D.lists[body.kind][body.name].length }); }
  if (key === 'POST /api/lists/delete') { delete D.lists[body.kind][body.name]; return r({ ok: true }); }
  if (key === 'GET /api/plans') return r({ online: true, email: '', general: { link: '', bank: '' }, plans: [{ id: 1, name: 'Weekly', price: '₦2,000', days: 7, payable: true, manual: { link: '', bank: 'Bank: Example Bank\nAccount: 0123456789\nName: Waapo' } }, { id: 2, name: 'Monthly', price: '₦5,000', days: 30, payable: true, manual: { link: '', bank: 'Bank: Example Bank\nAccount: 0123456789\nName: Waapo' } }] });
  if (key === 'POST /api/pay') { if (!body.email) return Promise.reject(new Error('Enter a valid email address for the receipt.')); return r({ url: 'https://example.com/pay' }); }
  if (key === 'GET /api/insights') return r({ hours: [0, 0, 0, 0, 0, 1, 2, 4, 7, 6, 5, 5, 6, 5, 4, 5, 6, 8, 11, 17, 21, 15, 7, 2], views7: 312, viewers7: 188, posts7: 9, totals: { posts: 142, viewers: 604, views: 5230 }, topViewers: [{ name: 'Ada Obi', number: '234801', views: 41, last: Date.now() }, { name: '', number: '234802', views: 33, last: Date.now() }, { name: 'Chidi', number: '234803', views: 29, last: Date.now() }], bestPosts: [{ preview: 'Black Friday is here', at: Date.now(), views: 233, sent: 2500 }, { preview: 'Good night everyone 🌙', at: Date.now(), views: 190, sent: 2400 }] });
  return r({});
}

/* ---------- start ---------- */
async function start() {
  const main = $('#main');
  if (!DEMO && !(tg && tg.initData)) { main.innerHTML = '<div class="full"><h1>Open Waapo from Telegram</h1><p>This page works inside the bot. Open the bot and tap <b>Open app</b>.</p></div>'; return; }
  if (!DEMO && (!API || API.includes('YOUR-SERVER'))) { main.innerHTML = '<div class="full"><h1>Almost ready</h1><p>The server address is not set. Edit <b>config.js</b> and set <b>WAAPO_API</b>.</p></div>'; return; }
  let err = null;
  for (let n = 0; n < 14; n++) {                       // a sleeping server can take about a minute to wake up
    try { await loadMe(); err = null; break; } catch (e) {
      err = e; if (!/^Cannot reach/.test(e.message)) break;
      main.innerHTML = '<div class="full"><h1>Waking the server…</h1><p>This can take up to a minute the first time.</p></div>';
      await new Promise(r => setTimeout(r, 5000));
    }
  }
  if (err) { main.innerHTML = `<div class="full"><h1>Can’t open the app</h1><p>${esc(err.message)}</p><button class="btn quiet" onclick="location.reload()">Try again</button></div>`; return; }
  await show('home');
  setInterval(refresh, 30000); document.addEventListener('visibilitychange', refresh);
  setInterval(() => { if (S.tab === 'sending') refresh(); }, 4000);
}
start();
})();
